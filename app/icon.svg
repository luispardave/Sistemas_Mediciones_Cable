<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo Gradiente Principal -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1035" />
    </linearGradient>

    <!-- Gradiente de Tarjeta -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Gradiente Neón (Azul a Violeta) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Filtro de Resplandor (Glow) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Sombra Parcial -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Icono (Cuadrado con bordes redondeados) -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Destello sutil de fondo -->
  <circle cx="256" cy="256" r="150" fill="url(#accentGrad)" opacity="0.15" filter="url(#glow)" />

  <!-- Tarjeta Central: Claqueta / Hoja de Registro -->
  <g filter="url(#dropShadow)">
    <!-- Base del Registro -->
    <rect x="112" y="120" width="288" height="300" rx="24" fill="url(#cardGrad)" stroke="url(#accentGrad)" stroke-width="3" />

    <!-- Cabezal de Claqueta / Cinta de Película -->
    <path d="M 112 144 C 112 130.745 122.745 120 136 120 L 376 120 C 389.255 120 400 130.745 400 144 L 400 180 L 112 180 Z" fill="url(#accentGrad)" />

    <!-- Perforaciones de Película en el Cabezal -->
    <rect x="136" y="140" width="28" height="20" rx="4" fill="#0F172A" />
    <rect x="188" y="140" width="28" height="20" rx="4" fill="#0F172A" />
    <rect x="242" y="140" width="28" height="20" rx="4" fill="#0F172A" />
    <rect x="296" y="140" width="28" height="20" rx="4" fill="#0F172A" />
    <rect x="348" y="140" width="28" height="20" rx="4" fill="#0F172A" />

    <!-- Registros / Filas de datos de metraje -->
    <!-- Fila 1: Timecode / Tag -->
    <rect x="144" y="212" width="64" height="12" rx="6" fill="#38BDF8" />
    <rect x="220" y="212" width="132" height="12" rx="6" fill="#475569" />

    <!-- Fila 2: Clip 1 (Aprobado) -->
    <circle cx="154" cy="256" r="7" fill="#10B981" />
    <rect x="176" y="250" width="180" height="12" rx="6" fill="#94A3B8" />

    <!-- Fila 3: Clip 2 (Aprobado) -->
    <circle cx="154" cy="296" r="7" fill="#10B981" />
    <rect x="176" y="290" width="140" height="12" rx="6" fill="#94A3B8" />

    <!-- Fila 4: Clip 3 (En revisión) -->
    <circle cx="154" cy="336" r="7" fill="#F59E0B" />
    <rect x="176" y="330" width="100" height="12" rx="6" fill="#64748B" />

    <!-- Fila 5: Barra de Línea de Tiempo / Audio / Metadata -->
    <rect x="144" y="370" width="224" height="26" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <rect x="158" y="379" width="4" height="8" rx="2" fill="#38BDF8" />
    <rect x="166" y="376" width="4" height="14" rx="2" fill="#38BDF8" />
    <rect x="174" y="381" width="4" height="4" rx="2" fill="#38BDF8" />
    <rect x="182" y="375" width="4" height="16" rx="2" fill="#818CF8" />
    <rect x="190" y="378" width="4" height="10" rx="2" fill="#818CF8" />
    <rect x="198" y="380" width="4" height="6" rx="2" fill="#818CF8" />
    <rect x="206" y="377" width="4" height="12" rx="2" fill="#A855F7" />
    <rect x="214" y="382" width="4" height="2" rx="1" fill="#A855F7" />
  </g>

  <!-- Insignia REC / Play destacada en la esquina superior derecha -->
  <g filter="url(#dropShadow)">
    <circle cx="370" cy="120" r="36" fill="#0F172A" stroke="url(#accentGrad)" stroke-width="3" />
    <circle cx="370" cy="120" r="22" fill="#EF4444" filter="url(#glow)" opacity="0.6" />
    <circle cx="370" cy="120" r="16" fill="#EF4444" />
    <polygon points="366,111 379,120 366,129" fill="#FFFFFF" />
  </g>
</svg>